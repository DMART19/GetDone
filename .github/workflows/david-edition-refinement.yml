name: David Edition Production Refinement
on:
  pull_request:
    paths:
      - "components/david-**"
      - "components/decision-actions.tsx"
      - "components/app-shell.tsx"
      - "components/business-system.tsx"
      - "playwright.config.ts"
      - "e2e/david-edition-cosmos.spec.ts"
      - "e2e/david-edition-contract.spec.ts"
      - "e2e/staging/david-edition-security.spec.ts"
      - "app/david-edition.css"
      - "app/page.tsx"
      - "app/decisions/**"
      - "app/resources/**"
      - ".github/workflows/david-edition-refinement.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx vitest run lib/businesses/capability-summary.test.ts lib/businesses/attention-summary.test.ts lib/conversation/continuity.test.ts lib/control-api/http.test.ts lib/control-api/postgres-auth.test.ts lib/persistence/postgres/owner-intent-history.test.ts lib/conversation/contracts.test.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:architecture
      - run: npm run verify:secrets
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/david-edition-cosmos.spec.ts e2e/david-edition-contract.spec.ts --project=desktop-chromium --project=mobile-chromium
        env:
          GETDONE_DAVID_EDITION: "true"
