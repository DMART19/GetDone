name: David Edition v37 Integration
on:
  pull_request:
    paths:
      - "components/david-edition-**"
      - "app/david-edition-**"
      - "app/api/universe/**"
      - "app/decisions/**"
      - "e2e/david-edition-v37.spec.ts"
      - ".github/workflows/david-edition-v37.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GETDONE_RUNTIME_ENV: development
      GETDONE_DATA_MODE: development-seed
      GETDONE_DAVID_EDITION: "true"
      NEXT_PUBLIC_APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm run verify:architecture
      - run: npm run verify:secrets

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GETDONE_RUNTIME_ENV: development
      GETDONE_DATA_MODE: development-seed
      GETDONE_DAVID_EDITION: "true"
      NEXT_PUBLIC_APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/david-edition-v37.spec.ts --project=desktop-chromium
