name: Browser Staging Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: browser-staging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NPM_CONFIG_IGNORE_SCRIPTS: "true"
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
  GETDONE_DB_SSL: "false"
  NEXT_PUBLIC_APP_ENV: staging
  GETDONE_RUNTIME_ENV: staging
  GETDONE_DATA_MODE: authoritative
  GETDONE_CONTROL_API_URL: http://localhost:3200
  GETDONE_WEBAUTHN_RP_ID: localhost
  GETDONE_WEBAUTHN_ORIGINS: http://localhost:3200
  GETDONE_AUTH_COOKIE_NAME: getdone_session
  GETDONE_SESSION_TTL_SECONDS: "3600"
  GETDONE_STEP_UP_TTL_SECONDS: "300"
  GETDONE_SIGN_IN_CHALLENGE_TTL_SECONDS: "300"
  GETDONE_STAGING_BROWSER_E2E: "true"
  GETDONE_STAGING_ACCEPTANCE_TOKEN: getdone-browser-staging-acceptance-token-v1

jobs:
  staging-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run db:migrate

      - name: Build authoritative staging app
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real PostgreSQL/auth browser acceptance
        run: npm run test:e2e:staging

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: getdone-browser-staging-evidence-${{ github.run_number }}
          path: |
            playwright-report-staging/
            test-results/
          if-no-files-found: error
          retention-days: 30
