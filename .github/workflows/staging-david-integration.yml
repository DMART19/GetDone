name: Staging David Edition integration
on:
  push:
    branches: ["staging/getdone-unified-acceptance-20261014"]
  pull_request:
    branches: ["codex/frontend-backend-integration-pass", "staging/david-edition-conversation-integration", "staging/getdone-unified-acceptance-20261014"]
    paths:
      - "lib/execution/**"
      - "lib/orchestration/**"
      - "lib/authorization/**"
      - "lib/operations/**"
      - "lib/persistence/**"
      - "lib/control-plane/**"
      - "n8n/**"
      - "package*.json"
      - "tsconfig*.json"
      - "components/**"
      - "scripts/*staging-backup*.mjs"
      - "scripts/test-staging-backup-restore.mjs"
      - "scripts/postgres-backup-integrity.mjs"
      - "docs/staging-engineering-acceptance-report-20261014.md"
      - "docs/staging-live-acceptance-checklist.md"
      - "lib/persistence/postgres/tls.ts"
      - "app/**"
      - "lib/businesses/**"
      - "scripts/issue-staging-owner-invitation.*"
      - "scripts/export-staging-n8n.mjs"
      - "docs/staging-n8n-import.md"
      - "e2e/david-edition-*.spec.ts"
      - ".github/workflows/staging-david-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: |
          node --check scripts/issue-staging-owner-invitation.mjs
          node --check scripts/create-staging-backup.mjs
          node --check scripts/restore-staging-backup.mjs
          node --check scripts/test-staging-backup-restore.mjs
          node --check scripts/export-staging-n8n.mjs
      - run: npx vitest run lib/businesses/capability-summary.test.ts lib/businesses/attention-summary.test.ts lib/conversation/acceptance.test.ts
      - run: npx vitest run lib/operations/staging-n8n-export.test.ts
      - run: npm run test -- --maxWorkers=2
      - run: npm run build:worker
      - run: npm run build:orchestration-worker
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:architecture
      - run: npm run verify:secrets
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/david-edition-cosmos.spec.ts e2e/david-edition-contract.spec.ts --project=desktop-chromium --project=mobile-chromium
        env:
          GETDONE_DAVID_EDITION: "true"
