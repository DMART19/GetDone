name: Format Phase 28 Agent

on:
  push:
    branches: [sol/phase28-universal-compute-nodes]
    paths:
      - ".github/workflows/format-phase28-agent.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sol/phase28-universal-compute-nodes
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache: false

      - run: gofmt -w agent

      - name: Commit formatting when needed
        run: |
          if git diff --quiet -- agent; then
            echo "Agent Go files already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent
          git commit -m "Apply canonical gofmt to Phase 28 Agent"
          git push origin HEAD:sol/phase28-universal-compute-nodes
