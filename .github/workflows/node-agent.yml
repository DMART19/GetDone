name: Node Agent

on:
  push:
    branches: [main, sol/phase28-universal-compute-nodes]
    paths:
      - "agent/**"
      - "scripts/build-node-agent.sh"
      - ".github/workflows/node-agent.yml"
  pull_request:
    branches: [main]
    paths:
      - "agent/**"
      - "scripts/build-node-agent.sh"
      - ".github/workflows/node-agent.yml"

permissions:
  contents: read

concurrency:
  group: node-agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache: false

      - name: Go format
        run: test -z "$(gofmt -l agent)"

      - name: Go vet
        working-directory: agent
        run: go vet ./...

      - name: Go tests
        working-directory: agent
        run: go test ./...

      - name: Cross-build Linux Agent
        run: bash scripts/build-node-agent.sh

      - name: Verify architecture artifacts
        run: |
          test -s dist/getdone-agent-linux-amd64
          test -s dist/getdone-agent-linux-arm64
          file dist/getdone-agent-linux-amd64 | grep -Eq 'x86-64|x86_64'
          file dist/getdone-agent-linux-arm64 | grep -Eq 'ARM aarch64|aarch64|ARM64'

      - uses: actions/upload-artifact@v7
        with:
          name: getdone-node-agent-${{ github.run_number }}
          path: |
            dist/getdone-agent-linux-amd64
            dist/getdone-agent-linux-arm64
          if-no-files-found: error
          retention-days: 30
