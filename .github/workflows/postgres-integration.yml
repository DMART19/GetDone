name: PostgreSQL Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: postgres-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NPM_CONFIG_IGNORE_SCRIPTS: "true"
  GETDONE_DB_RUNTIME_ROLE: getdone_tenant_runtime

jobs:
  postgres16:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run PostgreSQL 16 migration and concurrency acceptance
        run: npm run db:test-integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"

      - name: Run PostgreSQL startup/readiness acceptance
        run: npx vitest run lib/persistence/postgres/postgres-readiness.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Run PostgreSQL tenant RLS adversarial acceptance
        run: npx vitest run lib/persistence/postgres/postgres-tenant-rls.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Run production runtime startup validator acceptance
        run: npx vitest run lib/runtime/production-runtime-validator.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Run deterministic production bootstrap acceptance
        run: npx vitest run lib/auth/production-bootstrap.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Migrate Control API integration database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"

      - name: Run owner-safe AI Gateway health PostgreSQL acceptance
        run: npx vitest run lib/ai-gateway/health-postgres.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Run PostgreSQL-backed Control API acceptance
        run: npx vitest run lib/control-api/postgres-http.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_RUNTIME_ENV: staging
          GETDONE_DATA_MODE: authoritative
          NEXT_PUBLIC_APP_ENV: staging
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Run durable worker failure acceptance
        run: npx vitest run lib/execution/postgres-worker.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Run production auth and WebAuthn acceptance
        run: npx vitest run lib/auth/postgres-auth.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_POSTGRES_INTEGRATION: "true"
