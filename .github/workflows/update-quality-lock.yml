name: Refresh quality-tool lockfile

on:
  push:
    branches:
      - sol/quality-v8-playwright-ai-budget
    paths:
      - package.json
      - .github/workflows/update-quality-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/quality-v8-playwright-ai-budget
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for V8 coverage and Playwright"
          git push origin HEAD:sol/quality-v8-playwright-ai-budget
