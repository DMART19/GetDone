name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Bootstrap package-lock once
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
              git config user.name "getdone-ci"
              git config user.email "getdone-ci@users.noreply.github.com"
              git add package-lock.json
              git commit -m "Add reproducible npm package lock [skip ci]"
              git push origin HEAD:main
            fi
          fi

      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify:runtime
      - run: npm run verify:secrets
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_ENV: development
          GETDONE_RUNTIME_ENV: development
          GETDONE_DATA_MODE: development-seed
