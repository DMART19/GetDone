name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify:runtime
      - run: npm run verify:secrets
      - run: npm run verify:architecture
      - run: npm run verify:contract-versions
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run verify:coverage
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_ENV: development
          GETDONE_RUNTIME_ENV: development
          GETDONE_DATA_MODE: development-seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_APP_ENV: development
          GETDONE_RUNTIME_ENV: development
          GETDONE_DATA_MODE: development-seed
      - run: npm run release:generate
      - run: npm run verify:release

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: getdone-quality-evidence-${{ github.run_number }}
          path: |
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: getdone-release-evidence-${{ github.run_number }}
          path: |
            release/out/
            coverage/control-plane-module-coverage.json
          if-no-files-found: error
          retention-days: 30
